# AI Native OS permission policy.
# risk <low|medium|high> <allow|ask|deny>
# action <name> <risk> [<allow|ask|deny>]
#
# An action with no third field uses the decision for its risk level.
# file.create is low and is allowed immediately.
# file.delete is high and waits for `aios approve` or `aios deny`.
# system.poweroff is refused outright. The daemon does not power off the machine.

risk low allow
risk medium ask
risk high ask

action file.create low
action file.delete high
action system.poweroff high deny

# Local inference is allowed and logged. Cloud inference waits for a person.
# There is no cloud backend; approving model.cloud only records the decision.
action model.local low
action model.cloud high ask
